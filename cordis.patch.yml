# dsh-quick-prompts bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-quick-prompts`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (registers the quick-prompts settings namespace), and
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI.
- insert:
    - id: quick-prompts
      name: dsh-quick-prompts
